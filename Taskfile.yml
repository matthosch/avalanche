version: "3"

# Prefix every line with its task's name, so parallel tasks (task dev) say which one failed.
output: prefixed

vars:
  COMPOSE: docker compose -f infra/docker-compose.yml
  GENERATED: internal/api/gen web/src/api/schema.gen.ts

tasks:
  infra:up:
    desc: Start Redis, Postgres (commerce + ledger) and the payments mock (rebuilt if changed), and wait until healthy.
    cmds:
      - "{{.COMPOSE}} up -d --wait --build"

  infra:down:
    desc: Stop the infrastructure (keeps data volumes).
    cmds:
      - "{{.COMPOSE}} down"

  infra:reset:
    desc: Stop the infrastructure and delete its data volumes.
    cmds:
      - "{{.COMPOSE}} down -v"

  web:install:
    desc: Install the web app's dependencies (skipped when already up to date).
    dir: web
    sources: [package.json, pnpm-lock.yaml]
    # pnpm writes this on every install, so a missing node_modules always reinstalls,
    # whatever checksum Task has cached.
    generates: [node_modules/.modules.yaml]
    cmds:
      - pnpm install --frozen-lockfile

  gen:
    desc: Regenerate the Go server and TS client from api/openapi.yaml.
    cmds:
      - go generate ./internal/api/gen
      - pnpm --dir web gen

  gen:check:
    desc: Fail if generated code is out of date with api/openapi.yaml.
    cmds:
      - task: gen
      - git diff --exit-code -- {{.GENERATED}}
      - 'test -z "$(git ls-files --others --exclude-standard -- {{.GENERATED}})" || (echo "new generated files are not tracked: run task gen and commit" && exit 1)'

  seed:
    desc: "Reset commerce to the demo Stores and Flash Sales. Schedule them in the past with: task seed -- -ago 26m"
    cmds:
      - go run ./cmd/seed {{.CLI_ARGS}}

  dev:
    desc: Start the infrastructure, then run api, worker and the web app together.
    cmds:
      - task: infra:up
      - task: dev:services

  dev:services:
    internal: true
    deps: [dev:api, dev:worker, dev:web]

  dev:api:
    desc: Run api on :8080.
    cmds:
      - go run ./cmd/api

  dev:worker:
    desc: Run worker, which moves Flash Sales LIVE and ENDED on schedule.
    cmds:
      - go run ./cmd/worker

  dev:web:
    desc: Run the web app on :5173, proxying /api to api.
    dir: web
    deps: [web:install]
    cmds:
      - pnpm dev

  readme:gifs:
    desc: Redraw the README's animated diagrams into docs/media.
    dir: tools/readme-gifs
    cmds:
      - go run . -out ../../docs/media

  typecheck:
    desc: Typecheck Go (including e2e) and the web app.
    cmds:
      - go vet ./...
      - go vet -tags e2e ./e2e
      - pnpm --dir web typecheck

  test:
    desc: Run Go unit and integration tests (integration tests start their own containers; needs Docker).
    cmds:
      - go test ./...

  test:e2e:
    desc: Run end-to-end tests against the running stack (needs infra:up, dev:api and dev:worker).
    cmds:
      - go test -tags e2e -count=1 ./e2e
