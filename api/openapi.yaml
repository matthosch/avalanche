openapi: 3.0.3
info:
  title: Avalanche API
  version: 0.1.0
  description: Browser-facing API served by `api` (ADR-0005).
servers:
  - url: /api
paths:
  /flash-sales:
    get:
      operationId: listFlashSales
      summary: List Flash Sales across all Stores, soonest start first.
      responses:
        "200":
          description: Flash Sales.
          content:
            application/json:
              schema:
                type: object
                required: [flashSales]
                properties:
                  flashSales:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlashSale"
  /sign-in:
    post:
      operationId: signIn
      summary: Stub sign-in, no password. Issues a new Platform-wide Shopper ID.
      description: Later requests identify the Shopper by sending this ID in the `X-Shopper-Id` header.
      responses:
        "200":
          description: The new Shopper's ID.
          content:
            application/json:
              schema:
                type: object
                required: [shopperId]
                properties:
                  shopperId:
                    type: string
                    format: uuid
  /flash-sales/{flashSaleId}/holds:
    post:
      operationId: reserve
      summary: Reserve one unit of a LIVE Flash Sale, getting a Hold back.
      parameters:
        - name: flashSaleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ShopperId"
      responses:
        "201":
          description: The Shopper's new Hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "409":
          description: No new Hold. The reason says why; for ALREADY_HOLDING, `hold` is the Shopper's existing Hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveRefusal"
  /flash-sales/{flashSaleId}/holds/{holdId}/pay:
    post:
      operationId: pay
      summary: Pay for a HELD Hold with a test payment method, getting the Order back.
      description: Only the Hold's own Shopper may pay for it.
      parameters:
        - name: flashSaleId
          in: path
          required: true
          description: The Flash Sale the Hold is on, as given on the Hold.
          schema:
            type: string
            format: uuid
        - name: holdId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ShopperId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayRequest"
      responses:
        "200":
          description: The payment succeeded; the Shopper's new Order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: The payment method isn't one this API accepts.
        "404":
          description: The Shopper has no such Hold on that Flash Sale.
        "409":
          description: The Hold isn't HELD, so it can't be paid for; `state` says where it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayRefusal"
  /stores/{storeId}/balance:
    get:
      operationId: getStoreBalance
      summary: What the Platform owes a Store after the Platform's Fee, from the ledger.
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The Store's balance, computed from its Postings. A Store with no Orders has 0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreBalance"
  /platform/fee-revenue:
    get:
      operationId: getFeeRevenue
      summary: The Platform's Fee revenue across every Order, from the ledger.
      responses:
        "200":
          description: The Platform's Fee revenue, computed from its Postings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeRevenue"
components:
  parameters:
    ShopperId:
      name: X-Shopper-Id
      in: header
      required: true
      description: The Shopper ID issued by sign-in.
      schema:
        type: string
        format: uuid
  schemas:
    Store:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    FlashSale:
      type: object
      description: A time-boxed event in which one Store sells a fixed number of units of one product at one price.
      required: [id, store, productName, priceCents, currency, units, startsAt, endsAt, status]
      properties:
        id:
          type: string
          format: uuid
        store:
          $ref: "#/components/schemas/Store"
        productName:
          type: string
        priceCents:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [USD]
        units:
          type: integer
          format: int32
          minimum: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/FlashSaleStatus"
        unitsRemaining:
          type: integer
          format: int32
          minimum: 0
          description: Units not yet held or sold. Present only while the Flash Sale is LIVE.
    FlashSaleStatus:
      type: string
      description: Where a Flash Sale is in its lifecycle, SCHEDULED → LIVE → ENDED → CLOSED.
      enum: [SCHEDULED, LIVE, ENDED, CLOSED]
    Hold:
      type: object
      description: A Shopper's temporary claim on one unit of a Flash Sale, which either becomes an Order or is released.
      required: [id, flashSaleId, state, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        flashSaleId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/HoldState"
        expiresAt:
          type: string
          format: date-time
          description: When the Hold window closes.
    HoldState:
      type: string
      description: Where a Hold is in its life, HELD → PAYING → SOLD, or RELEASED.
      enum: [HELD, PAYING, SOLD, RELEASED]
    ReserveRefusal:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: >-
            SOLD_OUT: no units are available right now (released Holds may put some back).
            ALREADY_HOLDING: the Shopper already has a HELD, PAYING or SOLD Hold on this Flash Sale.
            NOT_LIVE: the Flash Sale hasn't started or has ended.
          enum: [SOLD_OUT, ALREADY_HOLDING, NOT_LIVE]
        hold:
          $ref: "#/components/schemas/Hold"
    PayRequest:
      type: object
      required: [paymentMethod]
      properties:
        paymentMethod:
          type: string
          description: A test payment method; card data never reaches our servers.
          enum: [pm_card_visa]
    PayRefusal:
      type: object
      required: [reason, state]
      properties:
        reason:
          type: string
          description: "NOT_HELD: the Hold is already PAYING or SOLD, or was RELEASED."
          enum: [NOT_HELD]
        state:
          $ref: "#/components/schemas/HoldState"
    Order:
      type: object
      description: The record of a Shopper's completed purchase, created when a Hold is sold.
      required: [id, holdId, flashSaleId, amountCents, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        holdId:
          type: string
          format: uuid
        flashSaleId:
          type: string
          format: uuid
        amountCents:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [USD]
        createdAt:
          type: string
          format: date-time
    StoreBalance:
      type: object
      required: [storeId, balanceCents, currency]
      properties:
        storeId:
          type: string
          format: uuid
        balanceCents:
          type: integer
          format: int64
        currency:
          type: string
          enum: [USD]
    FeeRevenue:
      type: object
      required: [feeRevenueCents, currency]
      properties:
        feeRevenueCents:
          type: integer
          format: int64
        currency:
          type: string
          enum: [USD]
