name: avalanche

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: avalanche
      POSTGRES_PASSWORD: avalanche
      POSTGRES_DB: commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, so the temporary init server (socket only) never counts as healthy,
      # and querying ledger proves the init script has run.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U avalanche -d ledger -tAc 'select 1'"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The Stripe-compatible payment provider (ADR-0007), on stripe-mock's usual port.
  payments-mock:
    build:
      context: ..
      dockerfile: infra/payments-mock.Dockerfile
    ports:
      - "12111:12111"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:12111/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  redis-data:
  postgres-data:
